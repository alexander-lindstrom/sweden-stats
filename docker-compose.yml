services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - caddy_data:/data
    depends_on:
      - backend
      - geoserver
    restart: unless-stopped

  backend:
    build:
      context: ./backend
    volumes:
      - ./data:/app/data:ro
    environment:
      - ALLOWED_ORIGINS=https://datamedmera.se
      - DATA_DIR=/app/data
    restart: unless-stopped

  geoserver:
    # kartoza/geoserver with the catalog in geoserver/data_dir (README: Deployment)
    build:
      context: .
      dockerfile: Dockerfile.geoserver
    environment:
      # The image defaults to a 2-4 GB heap; GeoServer has used about 1.6 GB in all.
      - INITIAL_MEMORY=512M
      - MAXIMUM_MEMORY=1536M
    volumes:
      - geoserver_data:/opt/geoserver/data_dir
      - ./data/geopackage:/opt/geopackage:ro
    env_file:
      - .env.production
    restart: unless-stopped

volumes:
  geoserver_data:
  caddy_data:
