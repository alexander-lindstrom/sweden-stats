services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    # No published ports: the edge proxy (alexander-lindstrom/server) reaches this
    # container on the shared `edge` network as sweden-stats-web:80.
    networks:
      default:
      edge:
        aliases:
          - sweden-stats-web
    depends_on:
      - backend
      - geoserver
    restart: unless-stopped

  backend:
    build:
      context: ./backend
    volumes:
      - ./data:/app/data:ro
    environment:
      - ALLOWED_ORIGINS=https://datamedmera.se
      - DATA_DIR=/app/data
    restart: unless-stopped

  geoserver:
    # kartoza/geoserver with the catalog in geoserver/data_dir (README: Deployment)
    build:
      context: .
      dockerfile: Dockerfile.geoserver
    environment:
      # The image defaults to a 2-4 GB heap; GeoServer has used about 1.6 GB in all.
      - INITIAL_MEMORY=512M
      - MAXIMUM_MEMORY=1536M
    volumes:
      - geoserver_data:/opt/geoserver/data_dir
      - ./data/geopackage:/opt/geopackage:ro
    env_file:
      - .env.production
    restart: unless-stopped

networks:
  # Created by the server repo's compose; start that first.
  edge:
    external: true

volumes:
  geoserver_data:
